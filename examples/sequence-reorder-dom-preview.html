<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BHE Sequence Reorder DOM Preview</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2933;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .preview-note {
        margin: 0 0 24px;
        color: #5f6b7a;
      }

      .bhe-sequence-reorder {
        padding: 22px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 20px rgb(31 41 51 / 8%);
      }

      .bhe-sequence-reorder__announcements {
        min-height: 20px;
        margin: 0 0 14px;
        color: #40566f;
        font-size: 14px;
      }

      .bhe-sequence-reorder__list {
        display: grid;
        gap: 10px;
        padding-left: 24px;
      }

      .bhe-sequence-reorder__item {
        padding: 12px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #fbfcfe;
      }

      .bhe-sequence-reorder__item.is-correct {
        border-color: #1f8a4c;
        background: #f0fbf4;
      }

      .bhe-sequence-reorder__item.is-incorrect {
        border-color: #c2413a;
        background: #fff5f4;
      }

      .bhe-sequence-reorder__label {
        display: block;
        margin-bottom: 10px;
      }

      .bhe-sequence-reorder__controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .bhe-sequence-reorder__move,
      .bhe-sequence-reorder__check {
        padding: 8px 10px;
        border: 1px solid #9aa8b7;
        border-radius: 8px;
        background: #ffffff;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      .bhe-sequence-reorder__move:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .bhe-sequence-reorder__check {
        margin-top: 18px;
        border-color: #2563eb;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
      }

      .bhe-sequence-reorder__feedback {
        margin-top: 18px;
      }

      .bhe-feedback {
        display: grid;
        gap: 10px;
      }

      .bhe-feedback__message {
        padding: 10px 12px;
        border: 1px solid #d7dee8;
        border-left-width: 5px;
        border-radius: 8px;
        background: #fbfcfe;
      }

      .bhe-feedback__summary {
        font-weight: 700;
      }

      .bhe-feedback__message-text {
        margin: 0;
      }

      .bhe-feedback--success {
        border-left-color: #1f8a4c;
      }

      .bhe-feedback--info {
        border-left-color: #2563eb;
      }

      .bhe-feedback--warning {
        border-left-color: #b26a00;
      }

      .bhe-feedback--error {
        border-left-color: #c2413a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BHE Sequence Reorder DOM Preview</h1>
      <p class="preview-note">
        Temporary text-only prototype. Use Move up / Move down to reorder the sequence.
      </p>
      <div id="app"></div>
    </main>

    <script type="module">
      import { sequenceReorderDomRenderer } from "../dist/packages/renderer/renderers/sequenceReorderDomRenderer.js";

      const sequenceSet = {
        kind: "pedagogical-object",
        type: "sequence-set",
        pedagogicalFamily: "structural",
        pedagogicalType: "sequence",
        metadata: {
          id: "sequence-reorder-dom",
          title: "Morning Routine Sequence",
          language: "en",
          level: "A1"
        },
        learningGoal: {
          domain: "English",
          skill: "chronology",
          topic: "daily routine",
          cefr: "A1"
        },
        content: {
          core: {
            items: [
              { id: "step-breakfast", label: "I eat breakfast.", position: 3 },
              { id: "step-wake-up", label: "I wake up.", position: 1 },
              { id: "step-school", label: "I go to school.", position: 4 },
              { id: "step-teeth", label: "I brush my teeth.", position: 2 }
            ],
            allowPartialOrder: true,
            shuffle: false
          }
        },
        interactionModes: ["reorder"],
        validate() {
          const positions = this.content.core.items.map((item) => item.position);
          return new Set(positions).size === positions.length;
        }
      };

      document
        .getElementById("app")
        .append(sequenceReorderDomRenderer.renderDom(sequenceSet));
    </script>
  </body>
</html>
