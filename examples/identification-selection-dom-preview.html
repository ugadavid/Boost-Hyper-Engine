<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BHE Identification Selection DOM Preview</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2933;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        max-width: 840px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .preview-note {
        margin: 0 0 24px;
        color: #5f6b7a;
      }

      .bhe-identification-selection {
        padding: 22px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 8px 20px rgb(31 41 51 / 8%);
      }

      .bhe-identification-selection__context {
        padding: 12px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #fbfcfe;
        line-height: 1.55;
      }

      .bhe-identification-selection__fieldset {
        display: grid;
        gap: 10px;
        margin: 18px 0 0;
        padding: 14px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
      }

      .bhe-identification-selection__fieldset legend {
        padding: 0 6px;
        font-weight: 700;
      }

      .bhe-identification-selection__option {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 10px;
        align-items: start;
        padding: 10px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #ffffff;
      }

      .bhe-identification-selection__option.is-correct {
        border-color: #1f8a4c;
        background: #f0fbf4;
      }

      .bhe-identification-selection__option.is-incorrect {
        border-color: #c2413a;
        background: #fff5f4;
      }

      .bhe-identification-selection__option.is-missing {
        border-color: #b26a00;
        background: #fff8ea;
      }

      .bhe-identification-selection__target-feedback {
        grid-column: 2;
        min-height: 18px;
        color: #5f6b7a;
        font-size: 13px;
      }

      .bhe-identification-selection__check {
        margin-top: 18px;
        padding: 10px 14px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .bhe-identification-selection__feedback {
        margin-top: 18px;
      }

      .bhe-feedback {
        display: grid;
        gap: 10px;
      }

      .bhe-feedback__message {
        padding: 10px 12px;
        border: 1px solid #d7dee8;
        border-left-width: 5px;
        border-radius: 8px;
        background: #fbfcfe;
      }

      .bhe-feedback__summary {
        font-weight: 700;
      }

      .bhe-feedback__message-text {
        margin: 0;
      }

      .bhe-feedback--success {
        border-left-color: #1f8a4c;
      }

      .bhe-feedback--info {
        border-left-color: #2563eb;
      }

      .bhe-feedback--warning {
        border-left-color: #b26a00;
      }

      .bhe-feedback--error {
        border-left-color: #c2413a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BHE Identification Selection DOM Preview</h1>
      <p class="preview-note">
        Temporary checkbox-style prototype. Select the transparent words, then click Check.
      </p>
      <div id="app"></div>
    </main>

    <script type="module">
      import { identificationSelectionDomRenderer } from "../dist/packages/renderer/renderers/identificationSelectionDomRenderer.js";

      const identificationSet = {
        kind: "pedagogical-object",
        type: "identification-set",
        pedagogicalFamily: "interpretive",
        pedagogicalType: "identification",
        metadata: {
          id: "identification-selection-dom",
          title: "Transparent Words in Italian",
          language: "it",
          level: "A2"
        },
        learningGoal: {
          domain: "Intercomprehension",
          skill: "lexical identification",
          topic: "transparent words",
          cefr: "A2"
        },
        content: {
          core: {
            context:
              "La comunicazione internazionale richiede attenzione alla pronuncia e alla formazione delle parole.",
            targets: [
              {
                id: "target-comunicazione",
                label: "comunicazione",
                expected: true,
                feedback: "comunicazione is close to communication."
              },
              {
                id: "target-internazionale",
                label: "internazionale",
                expected: true,
                feedback: "internazionale is highly transparent."
              },
              {
                id: "target-pronuncia",
                label: "pronuncia",
                expected: true,
                feedback: "pronuncia connects to pronunciation."
              },
              {
                id: "target-alla",
                label: "alla",
                expected: false,
                feedback: "alla is not the intended transparent lexical target here."
              }
            ],
            selectionMode: "multiple",
            allowPartialMatch: true
          }
        },
        interactionModes: ["selection"],
        validate() {
          return this.content.core.targets.length > 0;
        }
      };

      document
        .getElementById("app")
        .append(identificationSelectionDomRenderer.renderDom(identificationSet));
    </script>
  </body>
</html>
